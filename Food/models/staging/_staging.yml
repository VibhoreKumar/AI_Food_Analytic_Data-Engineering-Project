version: 2
models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: user_id
        tests: [not_null]
      - name: r_id
        tests: [not_null]
  - name: stg_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
  - name: stg_restaurants
    columns:
      - name: id
        tests: [unique, not_null]
  - name: stg_users
    columns:
      - name: user_id
        tests: [unique, not_null]
  - name: stg_reviews
    columns:
      - name: review_id
        tests: [unique, not_null]